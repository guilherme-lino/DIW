<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalhes | Catálogo Pokémon</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== HEADER ===== -->
  <header class="header-container">
    <nav class="navbar navbar-expand-lg">
      <div class="container">

        <a class="navbar-brand logo" href="index.html">
          <span class="bola"></span>
          Catálogo Pokémon
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 menu">
            <li class="nav-item"><a class="nav-link" href="index.html#inicio">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#pokedex">Pokédex</a></li>
          </ul>
          <a class="botao botao-pequeno ms-lg-3" href="index.html#pokedex">Explorar</a>
        </div>

      </div>
    </nav>
  </header>

  <main>
    <!-- conteúdo montado pelo app.js a partir do id da query string -->
    <section class="detalhe" id="detalhe">
      <div class="container py-5">
        <a href="index.html#pokedex" class="link-simples">← Voltar para a Pokédex</a>
        <div class="row g-4 mt-1" id="detalhe-conteudo"></div>
      </div>
    </section>

    <!-- fotos vinculadas ao item (montadas pelo app.js) -->
    <section class="fotos" id="fotos">
      <div class="container py-5">
        <div class="secao-titulo mb-4">
          <h2 id="fotos-titulo">Fotos</h2>
          <p>Arte oficial e sprites do jogo, de frente, de costas e na versão shiny.</p>
        </div>
        <div class="row row-cols-2 row-cols-md-4 g-4" id="fotos-lista"></div>
      </div>
    </section>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer>
    <div class="container py-4">
      <div class="row align-items-center">

        <div class="col-md-6 footer-logo mb-3 mb-md-0">
          <span class="bola bola-branca"></span>
          Catálogo Pokémon
        </div>

        <div class="col-md-6">
          <nav>
            <ul class="menu d-flex justify-content-md-end gap-4 list-unstyled mb-0">
              <li><a href="index.html#inicio">Início</a></li>
              <li><a href="index.html#pokedex">Pokédex</a></li>
            </ul>
          </nav>
        </div>

      </div>

      <div class="footer-rodape d-flex justify-content-between flex-wrap gap-2 mt-4 pt-3">
        <span>Projeto acadêmico - Desenvolvimento de Interfaces Web</span>
        <span>Dados e imagens: PokéAPI</span>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
