<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastrar Pokémon | Catálogo Pokémon</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header-container">
    <nav class="navbar navbar-expand-lg">
      <div class="container">

        <a class="navbar-brand logo" href="index.html">
          <span class="bola"></span>
          Catálogo Pokémon
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0 menu">
            <li class="nav-item"><a class="nav-link" href="index.html#inicio">Início</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#pokedex">Pokédex</a></li>
            <li class="nav-item"><a class="nav-link" href="cadastro_pokemon.html">Cadastrar</a></li>
          </ul>
        </div>

      </div>
    </nav>
  </header>

  <main>
    <section class="cadastro">
      <div class="container py-5">

        <div class="secao-titulo mb-4 text-center">
          <h2>Cadastrar Pokémon</h2>
          <p>Preencha os dados para adicionar um novo Pokémon ao catálogo.</p>
        </div>

        <div class="caixa p-4">
          <form id="form-cadastro" class="row g-3" novalidate>

            <div class="col-md-6">
              <label for="nome" class="form-label">Nome *</label>
              <input type="text" class="form-control" id="nome" required>
            </div>

            <div class="col-md-6">
              <label for="categoria" class="form-label">Categoria *</label>
              <select id="categoria" class="form-select" required>
                <option value="">Selecione...</option>
              </select>
            </div>

            <div class="col-12">
              <label for="descricaoCurta" class="form-label">Descrição curta *</label>
              <input type="text" class="form-control" id="descricaoCurta" maxlength="140" required>
            </div>

            <div class="col-12">
              <label for="descricaoCompleta" class="form-label">Descrição completa *</label>
              <textarea class="form-control" id="descricaoCompleta" rows="4" required></textarea>
            </div>

            <div class="col-12">
              <label for="imagem" class="form-label">Imagem (URL ou caminho) *</label>
              <input type="text" class="form-control" id="imagem" placeholder="Ex: images/25.png" required>
            </div>

            <div class="col-md-4">
              <label for="peso" class="form-label">Peso (kg) *</label>
              <input type="number" class="form-control" id="peso" min="0.1" step="0.1" required>
            </div>

            <div class="col-md-4">
              <label for="altura" class="form-label">Altura (m) *</label>
              <input type="number" class="form-control" id="altura" min="0.1" step="0.1" required>
            </div>

            <div class="col-md-4">
              <label for="habilidade" class="form-label">Habilidade</label>
              <input type="text" class="form-control" id="habilidade">
            </div>

            <div class="col-12">
              <label for="tags" class="form-label">Tags (separadas por vírgula)</label>
              <input type="text" class="form-control" id="tags" placeholder="Ex: kanto, raro">
            </div>

            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="destaque">
                <label class="form-check-label" for="destaque">Marcar como destaque</label>
              </div>
            </div>

            <div class="col-12 d-flex flex-wrap gap-2">
              <button type="submit" class="botao botao-primario">Cadastrar</button>
              <a href="index.html#pokedex" class="botao">Cancelar</a>
            </div>

            <div class="col-12 d-none" id="mensagem" role="alert"></div>

          </form>
        </div>

      </div>
    </section>
  </main>

  <footer>
    <div class="container py-4">
      <div class="footer-logo">
        <span class="bola bola-branca"></span>
        Catálogo Pokémon
      </div>
      <div class="footer-rodape d-flex justify-content-between flex-wrap gap-2 mt-4 pt-3">
        <span>Projeto acadêmico - Desenvolvimento de Interfaces Web</span>
        <span>Dados e imagens: PokéAPI</span>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="utils.js"></script>
  <script src="cadastro.js"></script>
</body>
</html>
